<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f4f4f5;--panel:#fff;--fg:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#2563eb;--shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--panel:#27272a;--fg:#f4f4f5;--muted:#a1a1aa;--line:#3f3f46;--accent:#60a5fa;--shadow:0 1px 3px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,sans-serif}
body{display:flex;overflow:hidden}
#strip{width:196px;flex:none;overflow-y:auto;padding:12px 10px;border-right:1px solid var(--line);background:var(--panel)}
#strip button{all:unset;display:flex;gap:6px;align-items:flex-start;width:100%;margin-bottom:10px;cursor:pointer}
#strip button span{width:18px;text-align:right;color:var(--muted);font-size:11px;padding-top:2px}
#strip .t{width:150px;aspect-ratio:var(--ar,16/9);overflow:hidden;border-radius:4px;border:2px solid transparent;background:#fff;box-shadow:var(--shadow)}
#strip button[aria-current] .t{border-color:var(--accent)}
#strip button[aria-current] span{color:var(--accent)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;padding:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage>*{max-width:100%;max-height:100%}
#bar{flex:none;display:flex;justify-content:space-between;gap:12px;padding:6px 14px;color:var(--muted);border-top:1px solid var(--line);font-size:12px}
#bar b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#note{margin:auto;padding:24px;color:var(--muted);text-align:center}
@media (max-width:640px){#strip{display:none}#stage{padding:8px}}
</style>
</head>
<body>
<nav id="strip" aria-label="Slides"></nav>
<main><div id="stage"><div id="note">Loading slides…</div></div><div id="bar"><b>{{TITLE}}</b><span id="pos"></span></div></main>
<script type="module">
const LIB = "{{LIB_URL}}", SRI = "{{LIB_SRI}}";
const $ = (id) => document.getElementById(id);
const note = (t) => { $("stage").innerHTML = ""; const d = document.createElement("div"); d.id = "note"; d.textContent = t; $("stage").append(d); };
const KEY = "pptx-slide:" + location.pathname;
async function lib() {
  const r = await fetch(LIB, { integrity: SRI, mode: "cors", credentials: "omit" });
  if (!r.ok) throw new Error("renderer " + r.status);
  const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: "text/javascript" }));
  try { return await import(url); } finally { URL.revokeObjectURL(url); }
}
async function main() {
  const [mod, deck] = await Promise.all([
    lib().catch((e) => { throw new Error("Could not load the slide renderer (" + e.message + ")."); }),
    fetch("deck.pptx", { cache: "no-store" }),
  ]);
  if (deck.status === 404) return note(document.title + " was deleted or moved.");
  if (!deck.ok) return note("Could not read the file (" + deck.status + ").");
  const stage = $("stage"); stage.innerHTML = "";
  const v = await mod.PptxViewer.open(await deck.arrayBuffer(), stage, {
    renderMode: "slide", fitMode: "contain", zipLimits: mod.RECOMMENDED_ZIP_LIMITS,
    lazySlides: true, lazyMedia: true, externalMedia: "block", pdfjs: false,
  });
  const n = v.slideCount;
  document.documentElement.style.setProperty("--ar", v.slideWidth + "/" + v.slideHeight);
  const strip = $("strip"), thumbs = [];
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting && !e.target.dataset.done) {
    e.target.dataset.done = 1; v.renderThumbnailToContainer(+e.target.dataset.i, e.target, { width: 146 }); } }, { root: strip, rootMargin: "400px" });
  for (let i = 0; i < n; i++) {
    const b = document.createElement("button"), s = document.createElement("span"), t = document.createElement("div");
    s.textContent = i + 1; t.className = "t"; t.dataset.i = i; b.append(s, t); b.onclick = () => go(i);
    strip.append(b); thumbs.push(b); io.observe(t);
  }
  let cur = -1;
  async function go(i) {
    i = Math.max(0, Math.min(n - 1, i)); if (i === cur) return;
    thumbs[cur]?.removeAttribute("aria-current"); cur = i;
    thumbs[i]?.setAttribute("aria-current", "true"); thumbs[i]?.scrollIntoView({ block: "nearest" });
    $("pos").textContent = (i + 1) + " / " + n;
    try { sessionStorage.setItem(KEY, i); } catch {}
    await v.goToSlide(i);
  }
  addEventListener("keydown", (e) => {
    const d = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
    if (d) { e.preventDefault(); go(cur + d); }
    else if (e.key === "Home") go(0); else if (e.key === "End") go(n - 1);
  });
  let start = 0; try { start = +sessionStorage.getItem(KEY) || 0; } catch {}
  if (!n) return note("This deck has no slides.");
  await go(start < n ? start : 0);
  document.body.dataset.ready = "1";
}
main().catch((e) => note(e.message || String(e)));
</script>
</body>
</html>
